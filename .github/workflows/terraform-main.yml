name: Terraform Module Pipeline
run-name: CI/CD Pipeline for Terraform Module

on:
  push:
    branches:
      - master    
env:
 TF_LOG: INFO
 AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
 AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 TF_WORKING_DIR: .
 TF_VERSION: 1.12.2
 PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

jobs:
  terraform_integration_test:
    name: Terraform Integration Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: aws cli setup
        uses: ./.github/actions/aws_cli

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Install Terraform
        uses: ./.github/actions/terraform

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: ./.github/actions/tflint
        
      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

      - name: Install Checkov Dependencies
        uses: ./.github/actions/checkov

      - name: Checkov Scan
        run: |
          $HOME/.checkov-env/bin/checkov \
            -d . \
            --framework terraform \
            --skip-path aws/dist

      - name: Terraform Plan
        run: |
          terraform plan -var-file=variables/test.tfvars -out=tfplan
      
      - name: Show Terraform Plan
        run: terraform show -no-color tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -var-file=variables/test.tfvars \
            -auto-approve

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: terraform_integration_test
    permissions: 
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create Release
        id: version
        run: |
          chmod +x scripts/tag_increment.sh
          ./scripts/tag_increment.sh